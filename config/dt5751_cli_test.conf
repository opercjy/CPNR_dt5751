# ==============================================================================
# CAEN DT5751 Master Configuration (10-bit, 1/2 GS/s)
# ==============================================================================

[Digitizer]
# 0 = 1 GS/s (4채널), 1 = 2 GS/s DES Mode (CH0, CH2 2채널)
EnableDESMode=0
RecordLength=4000
ChannelMask=1
# T0를 800ns에 두기 위한 비율 (RecordLength와 DES 여부에 따라 GUI에서 자동 계산됨)
PostTrigger=80
TriggerPolarity=1
ExtTriggerMode=0
SelfTriggerMode=1

[Synchronization]
# 0: 내부 클럭(Internal), 1: 전면 패널 외부 클럭(External CLK-IN)
ClockSource=0
# 0: 독립 구동, 1: Daisy Chain (다중 보드 TRG-IN / TRG-OUT 동기화)
RunSyncMode=0

[SoftwareDSP]
# 동시 계수 및 파형 분석 윈도우 (물리 시간 단위: ns)
CoincidenceWindow=20
BaselineSamples=400

[Channel_0]
# 10-bit (0~1023) 기준 세팅
DCOffset=32768
TriggerThreshold=580