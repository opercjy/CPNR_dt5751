# ==============================================================================
# [ CAEN DT5751 Configuration: CLI Debug & Test Edition ]
# 목적: DAQ 통신 무결성 검증, 베이스라인 노이즈 스캔, USB 데이터 전송률(Throughput) 부하 테스트
# 특징: 방사선원 없이도 전자회로의 열역학적 노이즈에 반응하도록 극단적인 초저-임계값(Ultra-low Threshold) 적용
# ==============================================================================

[Environment]
# 테스트 런이므로 메타데이터는 공란 또는 기본값으로 방치 가능
Operator=
AppliedHV=0V
Temperature=20.0

[Digitizer]
EnableDESMode=0
# 1채널(CH0) 단독 활성화로 인터럽트 부하 최소화
ChannelMask=1

# [중간 길이의 적분 윈도우]
# 2000 ns (2 us)는 펄스의 형태를 육안으로 확인하기에 충분하면서도, 
# 고속 트리거 환경에서 I/O 버스 병목을 유발하지 않는 테스트 최적화 길이임.
RecordLength=2000

# [T0 좌표 이동]
# 2000 ns의 30% (600 ns)를 프리-트리거(Pre-trigger) 영역으로 할당하고,
# 나머지 70% (1400 ns)를 T0 이후 파형 캡처에 할당.
# 노이즈 바닥의 요동(Fluctuation)을 관찰하기 위해 600 ns의 넉넉한 사전 마진 확보.
PostTrigger=70

TriggerPolarity=1
ExtTriggerMode=0
SelfTriggerMode=1

[Synchronization]
ClockSource=0
RunSyncMode=0

[SoftwareDSP]
# 동시계수 로직 테스트용 윈도우 (20 ns)
CoincidenceWindow=20
# PostTrigger로 확보된 600 ns의 프리-트리거 구간 내에서,
# 순수 노이즈 바닥의 평균을 산출하기 위해 앞부분 480개의 샘플(480 ns)을 적분 연산에 사용.
BaselineSamples=480

[Channel_0]
# [10% DAC Offset]
# 65535 * 0.1 = 6553. 
# 10-bit ADC 캔버스에서 베이스라인을 상위 90% 지점(약 921 ADC)에 위치시킴.
DCOffset=6553

# [제1원리적 노이즈 캡처 설계 (가장 중요한 테스트 파라미터)]
# 목표 베이스라인이 921 ADC에 형성될 때, 트리거 임계값을 919로 설정함.
# 즉, 베이스라인과의 격차가 단 '2 ADC Bin'에 불과함.
# 이는 양자화 노이즈(Quantization Noise)나 PMT의 미세한 암전류(Dark Current)만으로도 
# 하강 에지 트리거 조건을 만족하게 만들어, 외부 신호 입력 없이도 
# 수백 ~ 수천 Hz의 초고속 트리거를 자체적으로 유발(Self-oscillation)함.
# 이를 통해 DAQ의 메모리 버퍼 오버플로우 한계와 ZMQ 파이프라인의 전송 안정성을 스트레스 테스트(Stress Test) 할 수 있음.
TriggerThreshold=919
