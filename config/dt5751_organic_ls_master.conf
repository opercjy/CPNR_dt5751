# ==============================================================================
# CAEN DT5751 Configuration (Master Edition for Organic LS / Gd-LS)
# Target: Liquid Scintillator, Plastic Scintillator, Coincidence Setup
# ==============================================================================

[Environment]
Operator=J.Y. Choi
Temperature=24.5
AppliedHV=CH0:1200V, CH1:1200V

[Digitizer]
EnableDESMode=0
# LS의 붕괴 시간은 수십 ns 이내이므로 메모리 효율을 위해 512 ns로 압축
RecordLength=512
# CH0, CH1 활성화 (이진수 0011 = 3)
ChannelMask=3
# Target T0 = 100 ns 부근에 위치
PostTrigger=80
TriggerPolarity=1
ExtTriggerMode=0
SelfTriggerMode=1

[Synchronization]
ClockSource=0
RunSyncMode=0

[SoftwareDSP]
# 오프라인 및 모니터링 시 CH0, CH1 동시 발광 이벤트만 추출하기 위한 마스크
CoincidenceMask=3
CoincidenceWindow=20
BaselineSamples=80

[Channel_0]
DCOffset=6554
TriggerThreshold=891

[Channel_1]
DCOffset=6554
TriggerThreshold=891