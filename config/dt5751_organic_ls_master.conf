# ==============================================================================
# [ CAEN DT5751 Master Configuration: Organic Liquid Scintillator ]
# 물리적 대상: 유기 액체 섬광체(LS), 플라스틱 섬광체 등 수 ns ~ 수십 ns의 초고속 형광 소멸을 가지는 검출기
# 목적: 윈도우 단축을 통한 데드타임 극소화 및 고선속(High-flux) 환경 대응
# ==============================================================================

[Environment]
Operator=Unknown
AppliedHV=1500V
Temperature=20.0

[Digitizer]
EnableDESMode=0
ChannelMask=1

# [핵심] 유기 섬광체의 펄스는 매우 빠르게 생성되고 소멸함.
# 긴 윈도우는 오히려 다음 방사선 펄스가 겹치는 파일업(Pile-up) 현상과 
# USB/VME 대역폭 병목을 초래하여 데드타임을 기하급수적으로 증가시킴.
# 따라서 윈도우를 무기 섬광체의 1/4 수준인 1000 ns (1 us)로 대폭 단축하여 통계적 수집 한계치(Throughput) 상향.
RecordLength=1000

# 1000 ns 윈도우의 20% (200 ns) 지점에 T0 정렬. 
# 200 ns의 프리-트리거 마진만으로도 유기 섬광체의 베이스라인 평가에는 수학적으로 충분함.
PostTrigger=80

TriggerPolarity=1
ExtTriggerMode=0
SelfTriggerMode=1
AlwaysTriggered=0
RunSyncMode=0

[Channel_0]
# 음전압 펄스 수용을 위해 베이스라인을 ADC 상단 90%에 고정.
# 단, LS 셋업의 PMT 이득(Gain) 설정에 따라 고전압이 높아 오버플로우가 우려된다면 
# DCOffset을 3276 (베이스라인 95% 지점, ~972 ADC)으로 조정하여 동적 영역을 더 확보할 수 있음.
DCOffset=6554

# LS 특유의 단발성 암전류(Dark Current) 노이즈를 필터링하기 위한 임계값. 
TriggerThreshold=891
