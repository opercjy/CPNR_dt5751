# ==============================================================================
# [ CAEN DT5751 Master Configuration: Inorganic Scintillator ]
# 물리적 대상: NaI(Tl), CsI(Tl), BGO 등 완만하고 긴 발광 감쇄(Decay) 특성을 가진 섬광체
# 하드웨어 스펙: 1 GS/s (1 Sample = 1 ns), 10-bit ADC (0 ~ 1023), 16-bit DAC (0 ~ 65535)
# ==============================================================================

[Environment]
# 향후 데이터베이스에 기록되어 오프라인 분석 시 계통 오차 역추적의 기준이 되는 메타데이터
Operator=Unknown
# 인가된 고전압. 시스템 이득(Gain) 결정의 제1변수.
AppliedHV=950V
# 보드 및 환경 온도. ADC 칩과 PMT의 열적 표류(Thermal Drift, 통상 -0.2%/°C) 보상을 위한 지표.
Temperature=20.0

[Digitizer]
# Double Edge Sampling 모드. 
# 0으로 설정 시 4채널 독립 1 GS/s 작동. 1로 설정 시 채널을 교차 결합하여 2채널 2 GS/s로 나이퀴스트 주파수 확장.
EnableDESMode=0

# 활성화할 물리 채널을 비트마스크(Bitmask)로 지정.
# 예: CH0만 활성화 = 1 (2^0), CH0과 CH1 활성화 = 3 (2^0 + 2^1).
ChannelMask=1

# [핵심] 아날로그 신호를 캡처하는 총 시간 윈도우 (1 Sample = 1 ns).
# 무기 섬광체의 긴 발광 꼬리가 완전히 베이스라인으로 복귀할 때까지 전하를 적분하기 위해 4000 ns (4 us)라는 넓은 윈도우 부여. 
# 이를 통해 탄도 결손(Ballistic Deficit)에 의한 에너지 분해능 저하를 방지.
RecordLength=4000

# 캡처 윈도우 내에서 물리적 방사선 유입 시점(T0)을 어디에 위치시킬지 결정하는 백분율.
# RecordLength의 20% (4000 * 0.2 = 800 ns) 지점에 방사선 펄스의 선두(Leading Edge)를 강제 정렬.
# 펄스 이전 800 ns의 공간은 페데스탈(Pedestal) 노이즈 바닥을 연산하기 위한 '프리-트리거(Pre-trigger)' 마진으로 활용.
PostTrigger=80

# PMT 애노드에서 출력되는 신호는 전자 사태(Electron Avalanche)에 의한 음전압(Negative) 펄스임.
# 따라서 트리거 로직이 임계값을 '위에서 아래로 뚫고 내려갈 때(Cross-under)' 격발되도록 하강 에지(1)로 설정.
TriggerPolarity=1

# 타 검출기(예: 뮤온 베토, 동시계수 로직)와의 하드웨어적 연동을 위한 외부 LEMO 트리거 수신 여부.
# 0: 외부 신호 무시 (단독 측정), 1: 활성화.
ExtTriggerMode=0

# 내부 ADC 값이 TriggerThreshold를 넘었을 때 스스로 트리거를 생성할지 여부.
SelfTriggerMode=1

# 방사선원이 없는 상태에서 베이스라인의 열역학적 노이즈 분포(Zero-point)를 측정하기 위한 강제 소프트웨어 격발.
# 1로 설정 시 무작위 시점에 트리거를 강제하여 페데스탈 런(Pedestal Run) 수행. 일반 측정 시 0.
AlwaysTriggered=0

# 여러 대의 CAEN 디지타이저 보드를 데이지 체인(Daisy Chain)으로 묶어 클럭을 동기화할 때 사용. 단일 보드 사용 시 0.
RunSyncMode=0

[Channel_0]
# 16-bit DAC(0~65535)를 통해 아날로그 베이스라인 전압을 물리적으로 이동.
# 음전압 펄스의 낙하 범위를 극대화하기 위해 베이스라인을 10-bit ADC 캔버스의 최상단(약 90% 지점, ~921 ADC)에 안착.
# 65535 * (1 - 0.90) = 6554. 
# 이로써 921 ~ 0 ADC까지 전체 동적 영역의 90%를 오직 음전압 신호 캡처에만 할당.
DCOffset=6554

# 백색 노이즈(White Noise)에 의한 허위 트리거를 방지하기 위한 임계값.
# 베이스라인(약 921)에서 노이즈의 표준편차 마진(약 30 ADC)을 차감하여 설정.
# 신호가 891 ADC를 하향 돌파하는 순간 트리거 발생.
TriggerThreshold=891
