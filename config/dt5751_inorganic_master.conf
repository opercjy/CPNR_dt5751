# ==============================================================================
# CAEN DT5751 Configuration (Master Edition for Inorganic Scintillators)
# Target: NaI(Tl), CsI(Tl), BGO
# 
# [DT5751 10-bit Hardware Constraints]
# - Sample Rate: 1 GS/s (1 ns/Sample)
# - ADC Range: 10-bit (0 ~ 1023)
# - DAC Offset: 16-bit (0 ~ 65535)
# ==============================================================================

[Environment]
Operator=J.Y. Choi
Temperature=24.5
AppliedHV=CH0:900V

[Digitizer]
EnableDESMode=0
# 무기 섬광체의 완벽한 꼬리(Tail) 적분을 위한 4000 ns 윈도우
RecordLength=4000
# CH0 1개만 활성화 (이진수 0001 = 1)
ChannelMask=1
# Target T0 = 800 ns 지점에 위치 (4000 * 0.2 = 800)
PostTrigger=80
TriggerPolarity=1
ExtTriggerMode=0
SelfTriggerMode=1

[Synchronization]
ClockSource=0
RunSyncMode=0

[SoftwareDSP]
# 오프라인 분석 및 라이브 모니터 시 적용할 소프트웨어 동시 계수 그룹
# 현재 단일 채널이므로 CoincidenceMask=1 (CH0 독립 측정)
CoincidenceMask=1
CoincidenceWindow=20
BaselineSamples=640

[Channel_0]
# 16-bit DAC 기준: 10% (6553) 적용 -> 10-bit ADC에서 베이스라인 90% (약 921) 안착
DCOffset=6554
# 베이스라인(921)에서 노이즈 마진(-30)을 뺀 트리거 임계값
TriggerThreshold=891